[pytest]
# ---------------------------------------------------------------------------
# SP6/정리: CI 게이트 고정화
#
# 과거: pytest 설정 파일이 없었다. 그 결과
#   1) `pytest` 를 루트에서 실행하면 저장소 루트에 방치된 스크립트형
#      test_stage*.py 까지 수집을 시도하다 "I/O operation on closed file" 으로
#      죽고, **수집된 테스트가 0개**였다. CI 가 통과한 척하는 상태였다.
#   2) `pytest tests/` 와 `pytest` 의 결과가 달라 재현성이 없었다.
#
# 현재: testpaths 로 수집 범위를 tests/ 로 고정하고, 루트 스크립트는
#       scripts/verify/ 로 격리했다 (실행 방법은 scripts/verify/README.md).
# ---------------------------------------------------------------------------
testpaths = tests

# 하네스/벤치 무결성 모듈 등 테스트 외 코드가 수집 대상에 끼지 않도록 한다
norecursedirs = .git node_modules out uploads sessions vector_store engine scripts

python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 실패 시 즉시 원인이 보이도록 traceback 을 짧게 유지한다
addopts = -ra --strict-markers --tb=short

markers =
    slow: 장시간 실행되는 검증 (기본 비활성)
    integration: 외부 서비스(Stripe/Supabase/Gemini) 의존 검증
