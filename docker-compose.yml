version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api-server:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./uploads:/app/uploads
      - ./out:/app/out
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  celery-worker:
    build: .
    command: celery -A app.worker.celery_app worker --loglevel=info
    volumes:
      - .:/app
      - ./uploads:/app/uploads
      - ./out:/app/out
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - api-server
